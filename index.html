<!--
  EL SALTO VA LO PRIMERO, ANTES DE PINTAR NADA.
  Quien entra desde un móvil no llega a ver esta página: el navegador salta a
  su tienda en cuanto lee estas líneas. `location.replace` en vez de asignar
  `location.href` para que la página NO quede en el historial; si quedara, al
  pulsar "atrás" desde la tienda se volvería a saltar y la persona no podría
  retroceder nunca.
-->
<script>
(function () {
  var ua = navigator.userAgent || '';
  // El iPad moderno se identifica como Mac: se distingue porque tiene táctil.
  var esIOS = /iPad|iPhone|iPod/.test(ua) ||
              (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var esAndroid = /Android/.test(ua);
  if (esIOS) location.replace('https://apps.apple.com/app/id6815030361');
  else if (esAndroid) location.replace('https://play.google.com/store/apps/details?id=app.kasik.bienestar');
  // En ordenador no hay tienda a la que ir: se queda y se enseñan las dos.
})();
</script>

<style>
  :root {
    --fondo: #171b18;
    --texto: #f7f4ee;
    --tenue: #a7b0a7;
    --verde: #bcd8c5;
    --borde: rgba(247, 244, 238, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 48px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--fondo);
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 2rem;
    margin: 20px 0 4px;
  }
  p { color: var(--tenue); margin: 0 0 28px; max-width: 30rem; line-height: 1.6; }
  .tiendas { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  a {
    display: inline-block;
    padding: 14px 26px;
    border-radius: 999px;
    border: 1px solid var(--borde);
    color: var(--texto);
    text-decoration: none;
    font-size: 1rem;
  }
  a.principal { background: var(--verde); color: #17231c; border-color: transparent; }
  a:hover { border-color: var(--verde); }
  small { color: var(--tenue); margin-top: 28px; font-size: 0.8rem; }
</style>

<body>
  <img src="icono.png" alt="KASIK">

  <div class="tiendas">
    <a class="principal" href="https://play.google.com/store/apps/details?id=app.kasik.bienestar">Descargar para Android</a>
    <a href="https://apps.apple.com/app/id6815030361">Descargar para iPhone</a>
  </div>
  <small>Estás en un ordenador: elige tu tienda. Desde el móvil se abre sola.</small>
